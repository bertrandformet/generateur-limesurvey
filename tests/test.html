<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tests — générateur de questionnaire LimeSurvey</title>
</head>
<body>
<h1>Tests — générateur de questionnaire LimeSurvey</h1>
<p>Aucun framework : ouvre cette page dans un navigateur, les résultats s'affichent ci-dessous et dans la console (<code>window.__TEST_SUMMARY__</code>).</p>
<pre id="out" style="white-space: pre-wrap; font-family: monospace; font-size: 13px;"></pre>

<script type="module">
import { createState, buildListRadio, buildMultipleChoice, buildShortText, buildEquation, buildBoilerplate } from "../js/lss/builders.js";
import { assembleDocument } from "../js/lss/assemble.js";
import { validateDocument } from "../js/lss/validate.js";
import { parseMarkdownQuestions, parseMarkdownAnswerKey, applyAnswerKey, parseImplicitChecklists } from "../js/import/parse-markdown-quiz.js";
import { parseDelimited } from "../js/import/parse-tabular.js";
import { normalizeRows } from "../js/import/normalize.js";
import { buildSequence } from "../js/sequence.js";

const out = document.getElementById("out");
function log(msg) { out.textContent += msg + "\n"; }

let pass = 0;
let fail = 0;
const failures = [];

function assert(cond, msg) {
  if (cond) {
    pass++;
  } else {
    fail++;
    failures.push(msg);
    log("✗ FAIL — " + msg);
  }
}

function assertEqual(actual, expected, msg) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  assert(a === e, `${msg} — attendu ${e}, obtenu ${a}`);
}

function section(title) {
  log("\n=== " + title + " ===");
}

// ---------------------------------------------------------------------------
section("parseMarkdownQuestions — cas de base");
// ---------------------------------------------------------------------------
{
  const md = [
    "## Question 1 — Capitale",
    "**Quelle est la capitale de la France ?**",
    "- [ ] **A.** Lyon",
    "- [ ] **B.** Paris",
    "- [ ] **C.** Marseille",
  ].join("\n");
  const { questions, warnings } = parseMarkdownQuestions(md, "test");
  assertEqual(questions.length, 1, "une question extraite");
  assertEqual(warnings.length, 0, "aucun avertissement");
  if (questions[0]) {
    assertEqual(questions[0].code, "Q1", "code par défaut Q1 (pas de préfixe de niveau)");
    assertEqual(questions[0].options.length, 3, "3 options extraites");
    assertEqual(questions[0].options[1], { code: "B", text: "Paris" }, "option B correctement extraite");
    assertEqual(questions[0].type, "M", "type M par défaut avant application du corrigé");
  }
}

// ---------------------------------------------------------------------------
section("parseMarkdownQuestions — préfixe de niveau + [texte libre]");
// ---------------------------------------------------------------------------
{
  const md = [
    "## Découverte",
    "## Question 1 — Capitale",
    "**Une question ?**",
    "- [ ] **A.** Oui",
    "- [ ] **B.** Non",
    "",
    "## Question 2 — Autres remarques",
    "**Autres remarques ?**",
    "[texte libre]",
  ].join("\n");
  const { questions, warnings } = parseMarkdownQuestions(md, "test");
  assertEqual(warnings.length, 0, "aucun avertissement");
  assertEqual(questions.length, 2, "deux questions extraites");
  if (questions[0]) assertEqual(questions[0].code, "D1", "préfixe de niveau D appliqué");
  if (questions[1]) {
    assertEqual(questions[1].type, "T", "type T pour [texte libre]");
    assertEqual(questions[1].options.length, 0, "pas d'options pour une question T");
  }
}

// ---------------------------------------------------------------------------
section("parseMarkdownQuestions — question malformée toujours signalée");
// ---------------------------------------------------------------------------
{
  const md = ["## Question 1 — Cassée", "**Une question sans options**"].join("\n");
  const { questions, warnings } = parseMarkdownQuestions(md, "src.md");
  assertEqual(questions.length, 0, "aucune question extraite (structure invalide)");
  assert(warnings.length === 1 && /structure non reconnue/.test(warnings[0]), "avertissement structure non reconnue émis");
}

// ---------------------------------------------------------------------------
section("parseMarkdownQuestions — un titre de corrigé n'est plus lu comme une question ratée (régression)");
// ---------------------------------------------------------------------------
{
  const md = [
    "## Question 1 — Capitale",
    "**Q ?**",
    "- [ ] **A.** Lyon",
    "- [ ] **B.** Paris",
    "",
    "## Question 1 — Réponse B",
  ].join("\n");
  const { questions, warnings } = parseMarkdownQuestions(md, "src.md");
  assertEqual(questions.length, 1, "la vraie question est extraite");
  assertEqual(warnings.length, 0, "le titre de corrigé ne génère plus de faux avertissement");
}

// ---------------------------------------------------------------------------
section("parseMarkdownAnswerKey — extraction de lettres + faux positifs");
// ---------------------------------------------------------------------------
{
  const md = ["## Question 3 — Réponses A, C et D"].join("\n");
  const { answerKey, warnings } = parseMarkdownAnswerKey(md, "corrige.md");
  assertEqual(answerKey["Q3"], ["A", "C", "D"], "3 lettres extraites dans l'ordre");
  assertEqual(warnings.length, 0, "aucun avertissement");

  // Ne doit pas confondre un titre de question ordinaire contenant le mot
  // "réponse(s)" avec un titre de corrigé (bug historique de cette session).
  const falsePositive = parseMarkdownAnswerKey("## Question 4 — Fiabilité des réponses", "src.md");
  assertEqual(Object.keys(falsePositive.answerKey).length, 0, "un titre de question ordinaire n'est pas pris pour un corrigé");
}

// ---------------------------------------------------------------------------
section("applyAnswerKey — déduit le type L/M à partir du nombre de bonnes réponses (régression)");
// ---------------------------------------------------------------------------
{
  const questions = [
    { code: "Q1", type: "M", text: "Une bonne réponse", options: [{ code: "A", text: "x" }, { code: "B", text: "y" }], correct: [] },
    { code: "Q2", type: "M", text: "Deux bonnes réponses", options: [{ code: "A", text: "x" }, { code: "B", text: "y" }], correct: [] },
    { code: "Q3", type: "T", text: "Réponse libre", options: [], correct: [] },
  ];
  const unmatched = applyAnswerKey(questions, { Q1: ["B"], Q2: ["A", "B"], Q3: ["A"] });
  assertEqual(questions[0].type, "L", "une seule bonne réponse => type L (choix unique)");
  assertEqual(questions[1].type, "M", "deux bonnes réponses => reste type M");
  assertEqual(questions[2].type, "T", "le type T n'est jamais réécrit par le corrigé");
  assertEqual(unmatched, [], "aucun code du corrigé sans question correspondante");
}

// ---------------------------------------------------------------------------
section("parseImplicitChecklists — questionnaire d'auto-positionnement (☐, sans titre)");
// ---------------------------------------------------------------------------
{
  const md = [
    "**Concernant l'objectif, indiquez votre niveau de maîtrise :**",
    "",
    "☐ Insuffisante",
    "☐ Fragile",
    "☐ Satisfaisante",
    "",
    "**Qu'attendez-vous de cette formation ?** (Plusieurs réponses possibles)",
    "",
    "☐ Approfondir",
    "☐ Échanger",
  ].join("\n");
  const { questions } = parseImplicitChecklists(md, "positionnement.docx");
  assertEqual(questions.length, 2, "deux questions implicites détectées");
  if (questions[0]) {
    assertEqual(questions[0].type, "L", "choix unique par défaut (pas de mention 'plusieurs réponses')");
    assertEqual(questions[0].scored, false, "non notée");
    assertEqual(questions[0].options.length, 3, "3 options");
  }
  if (questions[1]) {
    assertEqual(questions[1].type, "M", "type M détecté via 'Plusieurs réponses possibles'");
  }
}

// ---------------------------------------------------------------------------
section("CSV — parseDelimited + normalizeRows, cas de base");
// ---------------------------------------------------------------------------
{
  const csv = [
    "code;type;texte;option_a;option_b;option_c;option_d;correct;coefficient",
    "Q1;L;Quelle est la capitale de la France ?;Lyon;Paris;Marseille;;B;1",
    "Q2;M;Cochez les nombres pairs;2;3;4;5;\"A,C\";2",
    "Q3;T;Autres remarques;;;;;;",
  ].join("\n");
  const { rows } = parseDelimited(csv);
  assertEqual(rows.length, 3, "3 lignes de données extraites (délimiteur ; détecté)");

  const { questions, warnings } = normalizeRows(rows);
  assertEqual(warnings.length, 0, "aucun avertissement sur un CSV valide");
  assertEqual(questions.length, 3, "3 questions normalisées");
  if (questions[0]) {
    assertEqual(questions[0].type, "L", "type L préservé");
    assertEqual(questions[0].correct, ["B"], "bonne réponse B");
    assertEqual(questions[0].weight, 1, "coefficient 1");
  }
  if (questions[1]) assertEqual(questions[1].correct, ["A", "C"], "colonne correct multi-lettres pour M");
  if (questions[2]) assertEqual(questions[2].type, "T", "type T reconnu, options ignorées");
}

// ---------------------------------------------------------------------------
section("normalizeRows — code invalide rejeté (régression sécurité/EM)");
// ---------------------------------------------------------------------------
{
  const { rows } = parseDelimited(
    "code;type;texte;option_a;option_b;correct\n" +
    "Q1 X;L;Une question ?;Oui;Non;A\n" +
    "Q2;L;Une autre question ?;Oui;Non;A\n"
  );
  const { questions, warnings } = normalizeRows(rows);
  assertEqual(questions.length, 1, "seule la ligne au code valide est importée");
  assert(warnings.some((w) => /code .* invalide/.test(w)), "avertissement explicite sur le code invalide");
  if (questions[0]) assertEqual(questions[0].code, "Q2", "la question au code valide (Q2) est bien celle importée");
}

// ---------------------------------------------------------------------------
section("normalizeRows — autres validations existantes");
// ---------------------------------------------------------------------------
{
  // Q1 : type L avec 2 bonnes réponses -> rejetée, donc son code n'est
  // jamais "pris" (la ligne suivante teste le doublon avec un code que
  // le contexte pose comme réellement déjà accepté, Q3).
  const { rows } = parseDelimited(
    "code;type;texte;option_a;option_b;correct\n" +
    "Q1;L;Deux bonnes réponses pour un type L ?;Oui;Non;\"A,B\"\n" +
    "Q3;L;Une question valide ?;Oui;Non;A\n" +
    "Q3;L;Code Q3 déjà pris ?;Oui;Non;A\n" +
    "Q2;Z;Type inconnu ?;Oui;Non;A\n"
  );
  const { questions, warnings } = normalizeRows(rows);
  assertEqual(questions.length, 1, "seule la vraie question valide (Q3, 1ère occurrence) est acceptée");
  assertEqual(warnings.length, 3, "un avertissement pour Q1 (mauvais nombre de réponses), le doublon Q3, et Q2 (type inconnu)");
  if (questions[0]) assertEqual(questions[0].text, "Une question valide ?", "c'est bien la première occurrence de Q3 qui est retenue");
}

// ---------------------------------------------------------------------------
section("sequence.js — positionnement des champs");
// ---------------------------------------------------------------------------
{
  const questions = [
    { code: "Q1", type: "L" },
    { code: "Q2", type: "L" },
  ];
  const fields = [
    { code: "END1", position: { mode: "end" } },
    { code: "START1", position: { mode: "start" } },
    { code: "AFTER_Q1_A", position: { mode: "after", afterCode: "Q1" } },
    { code: "AFTER_Q1_B", position: { mode: "after", afterCode: "Q1" } },
  ];
  const seq = buildSequence(questions, fields);
  const codes = seq.map((i) => i.code);
  assertEqual(codes, ["START1", "Q1", "AFTER_Q1_A", "AFTER_Q1_B", "Q2", "END1"], "ordre final : start, Q1, les deux champs après Q1 dans leur ordre de création, Q2, end (régression : étaient inversés)");
}

// ---------------------------------------------------------------------------
section("sequence.js — champ 'after' visant un code introuvable");
// ---------------------------------------------------------------------------
{
  const questions = [{ code: "Q1", type: "L" }];
  const fields = [
    { code: "F1", position: { mode: "after", afterCode: "INCONNU" } },
    { code: "F2", position: { mode: "after", afterCode: "INCONNU" } },
  ];
  const seq = buildSequence(questions, fields);
  const codes = seq.map((i) => i.code);
  assertEqual(codes, ["Q1", "F1", "F2"], "champs sans correspondance ajoutés à la fin, dans l'ordre de création");
}

// ---------------------------------------------------------------------------
section("Cœur du générateur LSS (builders / assemble / validate)");
// ---------------------------------------------------------------------------
{
  const SID = 999001;
  const state = createState(SID);
  const GID_INFOS = 1;
  const GID_QUESTIONS = 2;
  const GID_RESULTAT = 3;

  buildShortText(state, { gid: GID_INFOS, code: "NOM", text: "Nom", order: 1, mandatory: "Y" });
  buildShortText(state, { gid: GID_INFOS, code: "PRENOM", text: "Prénom", order: 2, mandatory: "N" });

  const q1 = buildListRadio(state, {
    gid: GID_QUESTIONS, code: "Q1", text: "Quelle est la capitale de la France ?",
    options: [{ code: "A", text: "Lyon" }, { code: "B", text: "Paris" }, { code: "C", text: "Marseille" }],
    correctCode: "B", order: 1,
  });

  const q2 = buildMultipleChoice(state, {
    gid: GID_QUESTIONS, code: "Q2", text: "Cochez les nombres pairs — avec un lien <a href='https://example.org' target='_blank'>test</a> et une apostrophe d'essai.",
    options: [{ code: "A", text: "2" }, { code: "B", text: "3" }, { code: "C", text: "4" }, { code: "D", text: "5" }],
    correctCodes: ["A", "C"], order: 2,
  });

  const formula = `${q1.formula} + ${q2.formula}`;
  buildEquation(state, { gid: GID_QUESTIONS, code: "SCORE", formula, order: 3, hidden: true });

  const feedbackHtml =
    `<p><strong>Votre résultat : {SCORE.NAOK}/2</strong></p>` +
    `{if(SCORE.NAOK>=2, "<p>Bravo, score parfait.</p>", "<p>Il en manque une, ce n'est pas grave.</p>")}`;
  buildBoilerplate(state, { gid: GID_RESULTAT, code: "FB", html: feedbackHtml, order: 1 });

  const meta = {
    title: "Fixture de test",
    welcomeHtml: "<p>Bienvenue dans ce test.</p>",
    endTextHtml: "<p>Merci.</p>",
    groups: [
      { gid: GID_INFOS, order: 1, grelevance: "1", name: "Informations", description: "" },
      { gid: GID_QUESTIONS, order: 2, grelevance: "1", name: "Questions", description: "" },
      { gid: GID_RESULTAT, order: 3, grelevance: "1", name: "Résultat", description: "" },
    ],
  };

  const xml = assembleDocument(state, meta);
  const errors = validateDocument(state, xml);

  assertEqual(errors, [], "validateDocument ne remonte aucune erreur sur une fixture correcte");
  assertEqual(state.rowsQuestions.length, 6, "6 questions top-level : NOM, PRENOM, Q1, Q2, SCORE, FB (les options de Q2 sont dans rowsSubquestions, pas ici)");
  assertEqual(state.rowsSubquestions.length, 4, "4 sous-questions (options de Q2)");

  const doc = new DOMParser().parseFromString(xml, "application/xml");
  assert(!doc.querySelector("parsererror"), "XML bien formé (DOMParser)");
  assert(/<subquestions>/.test(xml), "bloc <subquestions> présent");
  assert(/Q2_A\.NAOK/.test(xml), "formule Q2 référence bien Q2_A.NAOK");
  assert(!/\\"/.test(xml.match(/Votre résultat[\s\S]{0,400}/)?.[0] || ""), "pas de guillemet échappé \\\" dans le bloc feedback");

  window.__TEST_XML__ = xml;
}

// ---------------------------------------------------------------------------
log("\n=== Résumé ===");
log(`${pass} test(s) réussi(s), ${fail} échoué(s).`);
if (fail > 0) {
  log("\nÉchecs :");
  failures.forEach((f) => log("- " + f));
}
window.__TEST_SUMMARY__ = { pass, fail, failures };
console.log("TEST_DONE", window.__TEST_SUMMARY__);
</script>
</body>
</html>
